name: reVC windows premake x86

on:
  pull_request:
  push:
  release:
    types: published
env:
  GLFW_VER: "3.4"
  GLFW_BASE: "glfw-3.4.bin.WIN32"
  GLFW_FILE: "glfw-3.4.bin.WIN32.zip"
  GLFW_URL: "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN32.zip"
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [win-x86-librw_d3d9-mss, win-x86-librw_d3d9-oal, win-x86-librw_gl3_glfw-mss, win-x86-librw_gl3_glfw-oal]
        buildtype: [Debug, Release]
    steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        vs-prerelease: true
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
    - if: contains(matrix.platform, 'glfw')
      name: Download glfw
      run: |
          Invoke-WebRequest -Uri "${{env.GLFW_URL}}" -OutFile "${{env.GLFW_FILE}}"
    - if: contains(matrix.platform, 'glfw')
      name: Unpack archives
      run: |
          7z x ${{env.GLFW_FILE}}
    - name: Configure build
      run: |
        ./premake5 vs2022 --with-librw --glfwdir32=${{env.GLFW_BASE}}
    - name: Build
      run: |
        msbuild -m build/reVC.sln /property:Configuration=${{matrix.buildtype}} /property:Platform=${{matrix.platform}}
    - name: Move binaries to gamefiles
      run: |
        mv ./bin/${{matrix.platform}}/${{matrix.buildtype}}/reVC.exe ./gamefiles/
        mv ./bin/${{matrix.platform}}/${{matrix.buildtype}}/reVC.pdb ./gamefiles/
    - if: contains(matrix.platform, 'oal')
      name: Move dynamic dependencies to gamefiles
      run: |
        mv ./vendor/mpg123/dist/Win32/libmpg123-0.dll ./gamefiles/
        mv ./vendor/openal-soft/dist/Win32/OpenAL32.dll ./gamefiles/
    - name: Upload artifact to actions
      uses: actions/upload-artifact@v6
      with:
        name: reVC_${{matrix.buildtype}}_${{matrix.platform}}
        path: ./gamefiles/*
