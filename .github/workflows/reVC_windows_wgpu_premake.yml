name: reVC windows premake wgpu

on:
  pull_request:
  push:
  release:
    types: published

env:
  GLFW_BASE: "glfw-3.4.bin.WIN64"
  GLFW_FILE: "glfw-3.4.bin.WIN64.zip"
  GLFW_URL: "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip"
  PLATFORM: "win-amd64-librw_wgpu-oal"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [Debug, Release]
        discord: [OFF, ON]

    name: "WGPU | ${{ matrix.buildtype }}${{ matrix.discord == 'ON' && ' | discord' || '' }}"

    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download glfw
        run: Invoke-WebRequest -Uri "${{ env.GLFW_URL }}" -OutFile "${{ env.GLFW_FILE }}"

      - name: Unpack glfw
        run: 7z x ${{ env.GLFW_FILE }}

      - name: Configure build (premake)
        shell: pwsh
        run: |
          $pargs = @("vs2022", "--with-librw", "--glfwdir64=${{ env.GLFW_BASE }}")
          if ("${{ matrix.discord }}" -eq "ON") { $pargs += "--with-discord-rpc" }
          ./premake5 @pargs

      # premake encodes its "platform" into the MSVC *Configuration* name
      # ("<buildtype> <platform>") while the vcxproj <Platform> is the real
      # arch (x64). Passing /p:Platform=<premake platform> to the .sln leaks a
      # global Platform property that overrides the project's x64 and matches no
      # config (→ missing includes + "No Target Architecture"). So build each
      # vcxproj directly with the combined Configuration and Platform=x64.
      # dependson only creates a solution-level order (no ProjectReference), so
      # librw must be built explicitly first.
      # NOTE: shell must be cmd. premake's MSVC Configuration name contains a
      # space ("<buildtype> <platform>"); PowerShell mangles /p:Configuration=
      # "Debug win-amd64-librw_wgpu-oal" when calling native msbuild.exe (splits
      # at the space → msbuild sees Configuration=Debug, no such config → wrong/
      # empty config selected → "No Target Architecture"). cmd passes the quoted
      # value intact.
      - name: Build librw
        shell: cmd
        run: msbuild -m build/librw.vcxproj /p:Configuration="${{ matrix.buildtype }} ${{ env.PLATFORM }}" /p:Platform=x64

      # discord-rpc is another dependson (no ProjectReference), so build it
      # explicitly before reVC when enabled — reVC links discord-rpc.lib.
      - name: Build discord-rpc
        if: matrix.discord == 'ON'
        shell: cmd
        run: msbuild -m build/discord-rpc.vcxproj /p:Configuration="${{ matrix.buildtype }} ${{ env.PLATFORM }}" /p:Platform=x64

      - name: Build reVC
        shell: cmd
        run: msbuild -m build/reVC.vcxproj /p:Configuration="${{ matrix.buildtype }} ${{ env.PLATFORM }}" /p:Platform=x64

      - name: Move binaries to gamefiles
        run: |
          mv ./bin/${{ env.PLATFORM }}/${{ matrix.buildtype }}/reVC.exe ./gamefiles/
          mv ./bin/${{ env.PLATFORM }}/${{ matrix.buildtype }}/reVC.pdb ./gamefiles/

      - name: Move runtime dependencies to gamefiles
        run: |
          # premake's postbuild already stages wgpu_native.dll next to the exe
          mv ./bin/${{ env.PLATFORM }}/${{ matrix.buildtype }}/wgpu_native.dll ./gamefiles/
          mv ./vendor/mpg123/dist/Win64/libmpg123-0.dll ./gamefiles/
          mv ./vendor/openal-soft/dist/Win64/OpenAL32.dll ./gamefiles/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC_${{ matrix.buildtype }}_${{ env.PLATFORM }}${{ matrix.discord == 'ON' && '-discord' || '' }}
          path: ./gamefiles/*
