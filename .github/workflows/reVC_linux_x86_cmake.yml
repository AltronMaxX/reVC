name: reVC linux cmake x86

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [Debug, Release]
        discord_rpc: [ON, OFF]

    name: "${{ matrix.buildtype }} | discord_rpc=${{ matrix.discord_rpc }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add i386 architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install System Dependencies (i386)
        run: |
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-multilib \
            g++-multilib \
            libopenal-dev:i386 \
            libsndfile1-dev:i386 \
            libmpg123-dev:i386 \
            libgl1-mesa-dev:i386 \
            libx11-dev:i386 \
            libxrandr-dev:i386 \
            libxinerama-dev:i386 \
            libxcursor-dev:i386 \
            libxi-dev:i386 \
            libwayland-dev:i386 \
            libxkbcommon-dev:i386 \
            wayland-protocols \
            libwayland-bin \
            libglew-dev:i386

      - name: Compile GLFW from source (i386)
        run: |
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
          git clone --depth 1 -b 3.4 https://github.com/glfw/glfw.git
          cmake -S glfw -B glfw/build \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/i386-linux-gnu \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF
          cmake --build glfw/build -j$(nproc)
          sudo cmake --install glfw/build
          sudo ln -sf /usr/lib/i386-linux-gnu/libglfw3.a \
                      /usr/lib/i386-linux-gnu/libglfw.a

      # GLEW из исходников, т.к. libglew-dev:i386 может быть недоступен в некоторых окружениях
      - name: Compile GLEW from source (i386)
        run: |
          wget -q https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
          tar -xzf glew-2.2.0.tgz
          make -C glew-2.2.0 \
            CFLAGS.EXTRA="-m32" \
            LDFLAGS.EXTRA="-m32" \
            LIBDIR=/usr/lib/i386-linux-gnu \
            -j$(nproc)
          sudo make -C glew-2.2.0 install LIBDIR=/usr/lib/i386-linux-gnu

      - name: Configure (CMake, i386)
        run: |
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DREVC_VENDORED_LIBRW=ON  \
            -DREVC_AUDIO=OAL \
            -DREVC_WITH_DISCORD_RPC=${{ matrix.discord_rpc }} \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=GLFW \
            -DREVC_INSTALL=ON


      - name: Build
        run: cmake --build build --parallel

      - name: Collect artifact name
        id: artname
        run: |
          DRPC=""
          if [ "${{ matrix.discord_rpc }}" = "ON" ]; then
            DRPC="-drpc"
          fi
          echo "name=reVC_${{ matrix.buildtype }}_linux-x86-gl3-glfw-oal${DRPC}" >> "$GITHUB_OUTPUT"

      - name: Move binary to gamefiles
        run: |
          find build -name reVC -type f -exec cp {} ./gamefiles/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artname.outputs.name }}
          path: ./gamefiles/*
