name: reVC linux cmake wgpu

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [Debug, Release]

    name: "WGPU | ${{ matrix.buildtype }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libopenal-dev \
            libsndfile1-dev \
            libmpg123-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-bin

      - name: Configure (CMake)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} \
            -DREVC_VENDORED_LIBRW=ON \
            -DREVC_AUDIO=OAL \
            -DREVC_WITH_DISCORD_RPC=OFF \
            -DLIBRW_PLATFORM=WGPU

      - name: Build
        run: cmake --build build --parallel

      - name: Collect artifact name
        id: artname
        run: |
          echo "name=reVC_${{ matrix.buildtype }}_linux-amd64-wgpu-glfw-oal" >> "$GITHUB_OUTPUT"

      - name: Move binary to gamefiles
        run: |
          find build -name reVC -type f -exec cp {} ./gamefiles/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artname.outputs.name }}
          path: ./gamefiles/*
